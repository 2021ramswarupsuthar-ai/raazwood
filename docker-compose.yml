# Local Postgres for development (alternative to a free Neon database).
#   npm run db:up    then use DATABASE_URL=postgresql://raazwood:raazwood@localhost:5433/raazwood
services:
  db:
    image: postgres:16
    container_name: raazwood-db
    environment:
      POSTGRES_USER: raazwood
      POSTGRES_PASSWORD: raazwood
      POSTGRES_DB: raazwood
    ports:
      - '5433:5432'
    volumes:
      - raazwood-pg:/var/lib/postgresql/data
volumes:
  raazwood-pg:
